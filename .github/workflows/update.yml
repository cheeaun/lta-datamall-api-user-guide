name: Update user guide

on:
  schedule:
    # Every Monday at 03:17 UTC
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch PDF and convert to Markdown
        run: python scripts/convert.py --pdf-out guide.pdf

      - name: Verify conversion quality
        run: python scripts/check.py --pdf guide.pdf --md LTA_DataMall_API_User_Guide.md

      - name: Open a PR if the guide changed
        uses: peter-evans/create-pull-request@v7
        with:
          title: "Update LTA DataMall API User Guide"
          commit-message: "chore: refresh LTA DataMall API User Guide markdown"
          branch: bot/update-user-guide
          delete-branch: true
          body: |
            The upstream PDF at https://datamall.lta.gov.sg/content/dam/datamall/datasets/LTA_DataMall_API_User_Guide.pdf
            changed. This PR regenerates `LTA_DataMall_API_User_Guide.md` via
            `scripts/convert.py`; `scripts/check.py` passed.
